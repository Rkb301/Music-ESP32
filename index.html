<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="prac.css">
    <title>Spotify Rave Player</title>
</head>
<body>
    <div class="container">
        <div class="buttons-wrapper">
            <button data-query="red electronic">Red</button>
            <button data-query="blue chill">Blue</button>
            <button data-query="green ambient">Green</button>
            <button data-query="underground rave">RAVE</button>
            <button data-query="jumpstyle party">Jumpstyle</button>
            <button data-query="power electronic">Power</button>
        </div>

        <!-- Music Player -->
        <div class="music-player">
            <div class="player-header">
                <div class="track-info">
                    <div class="track-title">Login to Spotify</div>
                    <div class="track-artist">Click button below to authorize</div>
                </div>
            </div>

            <div class="visualizer">
                <div class="visualizer-bar" style="--bar-index: 0;"></div>
                <div class="visualizer-bar" style="--bar-index: 1;"></div>
                <div class="visualizer-bar" style="--bar-index: 2;"></div>
                <div class="visualizer-bar" style="--bar-index: 3;"></div>
                <div class="visualizer-bar" style="--bar-index: 4;"></div>
                <div class="visualizer-bar" style="--bar-index: 5;"></div>
                <div class="visualizer-bar" style="--bar-index: 6;"></div>
                <div class="visualizer-bar" style="--bar-index: 7;"></div>
            </div>

            <div class="player-progress">
                <div class="time-current">0:00</div>
                <div class="progress-bar">
                    <div class="progress-fill"></div>
                    <div class="progress-handle"></div>
                </div>
                <div class="time-duration">0:00</div>
            </div>

            <div class="player-controls">
                <button class="control-btn prev-btn" title="Previous">⏮</button>
                <button class="control-btn play-btn" title="Play/Pause">▶</button>
                <button class="control-btn next-btn" title="Next">⏭</button>
                <div class="volume-control">
                    <span class="volume-icon">🔊</span>
                    <input type="range" class="volume-slider" min="0" max="100" value="70">
                </div>
            </div>

            <div id="login-container" style="text-align: center; margin-top: 20px;">
                <a href="/login" style="padding: 10px 20px; background: #1DB954; color: white; text-decoration: none; border-radius: 25px; font-weight: bold;">
                    Login with Spotify
                </a>
            </div>
        </div>
    </div>

    <!-- Spotify Web Playback SDK -->
    <script src="https://sdk.scdn.co/spotify-player.js"></script>

    <script>
        // Check if user is authenticated
        const urlParams = new URLSearchParams(window.location.search);
        const accessToken = urlParams.get('access_token');
        const refreshToken = urlParams.get('refresh_token');

        if (!accessToken) {
            console.log('No access token. User must login via Spotify.');
        } else {
            // Store tokens
            sessionStorage.setItem('access_token', accessToken);
            sessionStorage.setItem('refresh_token', refreshToken);
            document.getElementById('login-container').style.display = 'none';
            initSpotifyPlayer();
        }

        const trackQueries = [
            { query: "red electronic", name: "Red" },
            { query: "blue chill", name: "Blue" },
            { query: "green ambient", name: "Green" },
            { query: "underground rave", name: "RAVE" },
            { query: "jumpstyle party", name: "Jumpstyle" },
            { query: "power electronic", name: "Power" }
        ];

        let player;
        let currentTrackIndex = -1;
        let isPlaying = false;
        let currentDeviceId;
        let currentTrackUri;
        let audioContext;
        let analyser;
        let dataArray;
        let animationId;

        const playBtn = document.querySelector('.play-btn');
        const prevBtn = document.querySelector('.prev-btn');
        const nextBtn = document.querySelector('.next-btn');
        const trackTitle = document.querySelector('.track-title');
        const trackArtist = document.querySelector('.track-artist');
        const progressFill = document.querySelector('.progress-fill');
        const progressHandle = document.querySelector('.progress-handle');
        const timeCurrent = document.querySelector('.time-current');
        const timeDuration = document.querySelector('.time-duration');
        const progressBar = document.querySelector('.progress-bar');
        const volumeSlider = document.querySelector('.volume-slider');
        const visualizerBars = document.querySelectorAll('.visualizer-bar');
        const buttons = document.querySelectorAll('.buttons-wrapper button');

        window.onSpotifyWebPlaybackSDKReady = () => {
            if (!accessToken) return;
            
            player = new Spotify.Player({
                name: 'Rave Player',
                getOAuthToken: callback => {
                    callback(sessionStorage.getItem('access_token'));
                },
                volume: 0.5
            });

            player.addListener('player_state_changed', state => {
                if (!state) return;
                isPlaying = !state.paused;
                playBtn.textContent = isPlaying ? '⏸' : '▶';
                
                if (state.current_track) {
                    trackTitle.textContent = state.current_track.name;
                    trackArtist.textContent = state.current_track.artists[0].name;
                    updateVisualizer();
                }

                // Update progress
                if (state.duration) {
                    timeDuration.textContent = formatTime(state.duration / 1000);
                    timeCurrent.textContent = formatTime(state.position / 1000);
                    const percent = (state.position / state.duration) * 100;
                    progressFill.style.width = `${percent}%`;
                    progressHandle.style.left = `${percent}%`;
                }
            });

            player.addListener('ready', ({ device_id }) => {
                currentDeviceId = device_id;
                console.log('✓ Spotify device ready:', device_id);
            });

            player.addListener('not_ready', () => {
                console.log('Device not ready');
            });

            player.connect();
        };

        function formatTime(seconds) {
            if (isNaN(seconds)) return '0:00';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        async function searchTrack(query) {
            try {
                const response = await fetch(
                    `https://api.spotify.com/v1/search?q=${encodeURIComponent(query)}&type=track&limit=1`,
                    {
                        headers: {
                            'Authorization': `Bearer ${sessionStorage.getItem('access_token')}`
                        }
                    }
                );
                const data = await response.json();
                if (data.tracks.items.length > 0) {
                    return data.tracks.items[0].uri;
                }
                console.warn(`No track found for: ${query}`);
                return null;
            } catch (error) {
                console.error('Search error:', error);
                return null;
            }
        }

        async function playTrack(trackUri) {
            if (!player || !currentDeviceId) {
                console.error('Player not ready');
                return;
            }

            try {
                await fetch(`https://api.spotify.com/v1/me/player/play?device_id=${currentDeviceId}`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `Bearer ${sessionStorage.getItem('access_token')}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ uris: [trackUri] })
                });
                isPlaying = true;
                playBtn.textContent = '⏸';
                updateVisualizer();
            } catch (error) {
                console.error('Playback error:', error);
            }
        }

        function togglePlay() {
            if (!player) return;
            player.togglePlay();
        }

        function updateVisualizer() {
            if (!analyser) return;
            try {
                analyser.getByteFrequencyData(dataArray);
                visualizerBars.forEach((bar, index) => {
                    const barIndex = Math.floor((index / visualizerBars.length) * dataArray.length);
                    const value = (dataArray[barIndex] / 255) * 100;
                    bar.style.setProperty('--bar-height', `${Math.min(value + 20, 100)}%`);
                });
            } catch (e) {
                console.warn('Visualizer error:', e);
            }

            if (isPlaying) {
                animationId = requestAnimationFrame(updateVisualizer);
            }
        }

        function initAudioContext() {
            if (audioContext) return;
            try {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 256;
                dataArray = new Uint8Array(analyser.frequencyBinCount);
                console.log('✓ Audio Context initialized');
            } catch (e) {
                console.error('Audio Context error:', e);
            }
        }

        function initSpotifyPlayer() {
            initAudioContext();
            playBtn.addEventListener('click', togglePlay);
            volumeSlider.addEventListener('input', (e) => {
                if (player) player.setVolume(e.target.value / 100);
            });

            buttons.forEach((button, index) => {
                button.addEventListener('click', async () => {
                    const query = button.dataset.query;
                    const trackUri = await searchTrack(query);
                    if (trackUri) {
                        await playTrack(trackUri);
                        trackTitle.textContent = 'Loading...';
                    }
                });
            });

            console.log('✓ Spotify player initialized');
        }

        // If already authenticated on page load
        if (accessToken) {
            setTimeout(initSpotifyPlayer, 1000);
        }
    </script>
</body>
</html>
