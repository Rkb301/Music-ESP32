<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="prac.css">
    <title>This is a Page</title>
</head>
<body>
    <div class="container">
        <div class="buttons-wrapper">
            <button data-track="red">Red</button>
            <button data-track="blue">Blue</button>
            <button data-track="green">Green</button>
            <button data-track="rave">RAVE</button>
            <button data-track="jumpstyle">Jumpstyle Party</button>
            <button data-track="power">Power</button>
        </div>

        <!-- Music Player -->
        <div class="music-player">
            <div class="player-header">
                <div class="track-info">
                    <div class="track-title">Select a track</div>
                    <div class="track-artist">Music Player</div>
                </div>
            </div>

            <div class="visualizer">
                <div class="visualizer-bar" style="--bar-index: 0;"></div>
                <div class="visualizer-bar" style="--bar-index: 1;"></div>
                <div class="visualizer-bar" style="--bar-index: 2;"></div>
                <div class="visualizer-bar" style="--bar-index: 3;"></div>
                <div class="visualizer-bar" style="--bar-index: 4;"></div>
                <div class="visualizer-bar" style="--bar-index: 5;"></div>
                <div class="visualizer-bar" style="--bar-index: 6;"></div>
                <div class="visualizer-bar" style="--bar-index: 7;"></div>
            </div>

            <div class="player-progress">
                <div class="time-current">0:00</div>
                <div class="progress-bar">
                    <div class="progress-fill"></div>
                    <div class="progress-handle"></div>
                </div>
                <div class="time-duration">0:00</div>
            </div>

            <div class="player-controls">
                <button class="control-btn prev-btn" title="Previous">⏮</button>
                <button class="control-btn play-btn" title="Play/Pause">▶</button>
                <button class="control-btn next-btn" title="Next">⏭</button>
                <div class="volume-control">
                    <span class="volume-icon">🔊</span>
                    <input type="range" class="volume-slider" min="0" max="100" value="70">
                </div>
            </div>
        </div>

        <audio id="audio-player" crossorigin="anonymous"></audio>
    </div>

    <script>
        const musicTracks = [
            {
                name: "red",
                title: "Red",
                artist: "Royalty Free",
                url: "red.mp3"
            },
            {
                name: "blue",
                title: "Paint The Town Blue",
                artist: "Royalty Free",
                url: "blue.mp3"
            },
            {
                name: "green",
                title: "Mirage",
                artist: "Royalty Free",
                url: "green.mp3"
            },
            {
                name: "rave",
                title: "Rave Machine",
                artist: "Royalty Free",
                url: "rave.mp3"
            },
            {
                name: "jumpstyle",
                title: "Jumpstyle Party",
                artist: "Royalty Free",
                url: "jumpstyle.mp3"
            },
            {
                name: "power",
                title: "The Power",
                artist: "Royalty Free",
                url: "power.mp3"
            }
        ];

        const audioPlayer = document.getElementById('audio-player');
        const playBtn = document.querySelector('.play-btn');
        const prevBtn = document.querySelector('.prev-btn');
        const nextBtn = document.querySelector('.next-btn');
        const trackTitle = document.querySelector('.track-title');
        const trackArtist = document.querySelector('.track-artist');
        const progressFill = document.querySelector('.progress-fill');
        const progressHandle = document.querySelector('.progress-handle');
        const timeCurrent = document.querySelector('.time-current');
        const timeDuration = document.querySelector('.time-duration');
        const progressBar = document.querySelector('.progress-bar');
        const volumeSlider = document.querySelector('.volume-slider');
        const visualizerBars = document.querySelectorAll('.visualizer-bar');
        const buttons = document.querySelectorAll('.buttons-wrapper button');

        let currentTrackIndex = -1;
        let isPlaying = false;
        let audioContext;
        let analyser;
        let dataArray;
        let animationId;
        let source;

        // Initialize Web Audio API for visualizer
        function initAudioContext() {
            if (audioContext) return;
            try {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 256;
                
                // Create source and connect to analyser
                source = audioContext.createMediaElementAudioSource(audioPlayer);
                source.connect(analyser);
                analyser.connect(audioContext.destination);
                dataArray = new Uint8Array(analyser.frequencyBinCount);
                console.log('✓ Audio Context initialized successfully');
            } catch (e) {
                console.error('✗ Error initializing Audio Context:', e);
            }
        }

        function formatTime(seconds) {
            if (isNaN(seconds)) return '0:00';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        function updateVisualizer() {
            if (!analyser) return;
            try {
                analyser.getByteFrequencyData(dataArray);
                
                visualizerBars.forEach((bar, index) => {
                    const barIndex = Math.floor((index / visualizerBars.length) * dataArray.length);
                    const value = (dataArray[barIndex] / 255) * 100;
                    bar.style.setProperty('--bar-height', `${Math.min(value + 20, 100)}%`);
                });
            } catch (e) {
                console.warn('Visualizer update error:', e);
            }

            if (isPlaying) {
                animationId = requestAnimationFrame(updateVisualizer);
            }
        }

        function loadTrack(trackIndex) {
            if (trackIndex < 0 || trackIndex >= musicTracks.length) return;
            
            const track = musicTracks[trackIndex];
            currentTrackIndex = trackIndex;
            
            console.log(`Loading track: ${track.title} - ${track.artist}`);
            
            audioPlayer.src = track.url;
            trackTitle.textContent = track.title;
            trackArtist.textContent = track.artist;
            
            // Highlight active button
            buttons.forEach(btn => btn.classList.remove('active'));
            const activeBtn = document.querySelector(`button[data-track="${track.name}"]`);
            if (activeBtn) activeBtn.classList.add('active');
        }

        function togglePlay() {
            initAudioContext();
            
            if (currentTrackIndex === -1) {
                loadTrack(0);
            }

            if (isPlaying) {
                audioPlayer.pause();
                isPlaying = false;
                playBtn.textContent = '▶';
                cancelAnimationFrame(animationId);
                console.log('Paused');
            } else {
                // Resume audio context if suspended (browser requirement)
                if (audioContext && audioContext.state === 'suspended') {
                    audioContext.resume();
                }
                
                audioPlayer.play().then(() => {
                    isPlaying = true;
                    playBtn.textContent = '⏸';
                    updateVisualizer();
                    console.log('✓ Playing');
                }).catch(err => {
                    console.error('✗ Playback failed:', err);
                    alert('Playback failed. Check browser console for details.');
                });
            }
        }

        function nextTrack() {
            loadTrack((currentTrackIndex + 1) % musicTracks.length);
            if (isPlaying) {
                audioPlayer.play().catch(err => console.error('Playback failed:', err));
            }
        }

        function prevTrack() {
            loadTrack((currentTrackIndex - 1 + musicTracks.length) % musicTracks.length);
            if (isPlaying) {
                audioPlayer.play().catch(err => console.error('Playback failed:', err));
            }
        }

        // Event listeners
        playBtn.addEventListener('click', togglePlay);
        nextBtn.addEventListener('click', nextTrack);
        prevBtn.addEventListener('click', prevTrack);

        audioPlayer.addEventListener('timeupdate', () => {
            const duration = audioPlayer.duration;
            const currentTime = audioPlayer.currentTime;
            
            timeCurrent.textContent = formatTime(currentTime);
            timeDuration.textContent = formatTime(duration);
            
            const percent = (currentTime / duration) * 100 || 0;
            progressFill.style.width = `${percent}%`;
            progressHandle.style.left = `${percent}%`;
        });

        audioPlayer.addEventListener('ended', nextTrack);

        audioPlayer.addEventListener('error', (e) => {
            console.error('✗ Audio load error:', e);
            console.error('Error code:', audioPlayer.error?.code, audioPlayer.error?.message);
        });

        audioPlayer.addEventListener('canplay', () => {
            console.log('✓ Audio loaded and ready to play');
        });

        progressBar.addEventListener('click', (e) => {
            const rect = progressBar.getBoundingClientRect();
            const percent = (e.clientX - rect.left) / rect.width;
            audioPlayer.currentTime = percent * audioPlayer.duration;
        });

        volumeSlider.addEventListener('input', (e) => {
            audioPlayer.volume = e.target.value / 100;
        });

        // Button click handlers
        buttons.forEach((button, index) => {
            button.addEventListener('click', () => {
                const trackName = button.dataset.track;
                const trackIndex = musicTracks.findIndex(t => t.name === trackName);
                loadTrack(trackIndex);
                if (!isPlaying) {
                    togglePlay();
                } else {
                    audioPlayer.play().catch(err => console.error('Playback failed:', err));
                }
            });
        });

        // Set initial volume
        audioPlayer.volume = 0.7;
        
        console.log('✓ Music player initialized. Using local audio files.');
    </script>
</body>
</html>
