[build]
  command = "npm install"
  functions = "functions"
  publish = "."

[[redirects]]
  from = "/login"
  to = "/.netlify/functions/login"
  status = 302

[[redirects]]
  from = "/callback"
  to = "/.netlify/functions/callback"
  status = 200

[[redirects]]
  from = "/refresh-token"
  to = "/.netlify/functions/refresh-token"
  status = 200
